<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GraphQL Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        table { margin-top: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-center mb-4">GraphQL API Demo</h1>
    
    <button id="loadProducts" class="btn btn-primary mb-3">Load All Products (Sorted by Price)</button>
    <button id="loadProductsByCat" class="btn btn-info mb-3">Load Products by Category (ID=1)</button>
    <button id="createUser" class="btn btn-success mb-3">Create Sample User</button>
    
    <table id="dataTable" class="table table-striped table-bordered">
        <thead>
            <tr><th>ID</th><th>Title/Fullname</th><th>Price/Email</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
    function callGraphQL(query, callback) {
        $.ajax({
            url: '/graphql',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ query: query }),
            success: callback,
            error: function(err) { alert('Error: ' + err.responseText); }
        });
    }

    $('#loadProducts').click(function() {
        callGraphQL(`{
            allProductsSortedByPrice {
                id
                title
                price
            }
        }`, function(res) {
            let tbody = $('#dataTable tbody');
            tbody.empty();
            res.data.allProductsSortedByPrice.forEach(p => {
                tbody.append(`<tr><td>${p.id}</td><td>${p.title}</td><td>${p.price}</td></tr>`);
            });
        });
    });

    $('#loadProductsByCat').click(function() {
        callGraphQL(`{
            productsByCategory(categoryId: 1) {
                id
                title
                price
            }
        }`, function(res) {
        });
    });

    $('#createUser').click(function() {
        callGraphQL(`mutation {
            createUser(input: {fullname: "Ajax User", email: "ajax@example.com", password: "pass", phone: "123"}) {
                id
                fullname
                email
            }
        }`, function(res) {
            let user = res.data.createUser;
            alert('Created User ID: ' + user.id);
        });
    });
</script>
</body>
</html>
